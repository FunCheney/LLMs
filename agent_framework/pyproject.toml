[project]
name = "agent-framework"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "XuLin", email = "Fchen" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.156.4",
    "pydantic>=2.14.1",
    "temporalio>=1.34.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
agent-server = "agent_framework.server:main"
agent-worker = "agent_framework.worker:run_worker"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
