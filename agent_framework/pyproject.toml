# workspace 根 —— 只做编排与工具配置，本身不产出包
# 成员：packages/*（框架库）、apps/*（产品应用）

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
    "httpx>=0.28.1",
    "ruff>=0.9.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["packages/agent_framework/tests", "apps/growth_agent/tests"]
addopts = "-q --strict-markers"
# 适配器测试全是 async：auto 模式省掉每个用例的 @pytest.mark.asyncio
asyncio_mode = "auto"
markers = [
    "live: 需要真实 API 凭证的用例，默认跳过；显式执行 `uv run pytest -m live`",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["packages/agent_framework/src", "apps/growth_agent/src"]
ignore_missing_imports = true
warn_unused_ignores = true
