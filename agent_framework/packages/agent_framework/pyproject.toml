[project]
name = "agent-framework"
version = "0.1.0"
description = "Agent framework: LLM adapter / memory / knowledge / skills / planner / resilience"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.156.4",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
agent-server = "agent_framework.server.app:main"

[project.optional-dependencies]
# W9 D4 的 LangGraph 对照实现。**刻意做成 extra 而不是主依赖**：
# 主实现（`multi_agent/supervisor.py`）不 import 它，装不装都不影响生产路径；
# 没装时 `langgraph_variant` 的 import 不报错，对照测试自动 skip。
langgraph = ["langgraph>=1.0"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
