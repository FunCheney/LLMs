[project]
name = "agent-framework"
version = "0.1.0"
description = "Agent framework: LLM adapter / memory / knowledge / skills / planner / resilience"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.156.4",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.6.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
agent-server = "agent_framework.server.app:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
