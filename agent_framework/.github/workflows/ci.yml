name: ci

# 门禁只跑"零网络"的那一套：没有 key、没有 Redis、没有 docker。
# 需要真机/容器的步骤（-m live、make load、compose）留给人工，别让 CI 变成
# "有 key 就烧钱、没 key 就红叉"的两难。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest (offline, live 自动跳过)
        run: uv run pytest --basetemp=.pytest_tmp

      - name: Smoke eval (10 cases, fixture 回放)
        run: uv run python evals/scripts/run_smoke.py

      - name: Golden set validation (引用 / 难度分布 / 去重 / 对抗样例)
        run: uv run python evals/scripts/validate_golden.py

      - name: Golden eval (54 cases, fixture 回放, 分层指标)
        run: uv run python evals/scripts/run_eval.py --no-write

      # 反向验证之三：单条失败必须让整批的退出码非 0，但**不许中断整批**。
      # 只验退出码不够——把 try/except 写成 raise 也能让退出码非 0，
      # 所以 run_eval 的 --break-case 内部还会断言"其余 case 照常跑完"。
      - name: Eval gate must be able to fail
        run: |
          if uv run python evals/scripts/run_eval.py --no-write --break-case gold-c03; then
            echo "评测门禁没有变红：判据是摆设" >&2
            exit 1
          fi

      # 反向验证：门禁必须能红。这里故意把 smoke 集复制一份并改坏一条断言，
      # 期望退出码为 1。没有这一步，"全绿"永远无法证明门禁在工作。
      - name: Smoke gate must be able to fail
        run: |
          python - <<'PY'
          from pathlib import Path

          src = Path("evals/golden/smoke_v1.jsonl")
          out = Path("evals/golden/_broken.jsonl")
          lines = [
              line.replace('"text_contains": ["MCP"]', '"text_contains": ["绝不存在的文案"]')
              if '"smoke-01"' in line
              else line
              for line in src.read_text("utf-8").splitlines()
          ]
          out.write_text("\n".join(lines) + "\n", "utf-8")
          PY
          if uv run python evals/scripts/run_smoke.py --golden evals/golden/_broken.jsonl; then
            echo "门禁没有变红：判据是摆设" >&2
            exit 1
          fi
          rm -f evals/golden/_broken.jsonl

      # ---- W4 D3：回归门禁 ---------------------------------------------- #
      # 先产出一份可比的离线快照（落盘到 runner 的 evals/history，不进仓库），
      # 再拿它与仓库里提交的 baseline.json 比。基线是**离线**指标，
      # 只证明执行管道在线；在线档要另建 baseline-online.json（两者不可互比）。
      - name: Eval snapshot for gate (offline)
        run: uv run python evals/scripts/run_eval.py --week gate --judge

      - name: Regression gate vs baseline
        run: uv run python evals/scripts/regression_gate.py --current evals/history/gate-eval.json

      # 反向验证之四：门禁必须能拦住劣化。把当前快照的成功率改成 0.5，
      # 期望退出码非 0。只验"通过"的门禁无法证明它在工作。
      - name: Regression gate must be able to fail
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          src = Path("evals/history/gate-eval.json")
          payload = json.loads(src.read_text("utf-8"))
          payload["pipeline"]["success_rate"] = 0.5
          Path("evals/history/gate-broken.json").write_text(
              json.dumps(payload, ensure_ascii=False), "utf-8"
          )
          PY
          if uv run python evals/scripts/regression_gate.py --current evals/history/gate-broken.json; then
            echo "回归门禁没有变红：阈值是摆设" >&2
            exit 1
          fi

      - name: Judge agreement (规则基线，仅证明链路通)
        run: uv run python evals/scripts/judge_agreement.py --no-write
