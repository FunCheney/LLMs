[project]
name = "growth-agent"
version = "0.1.0"
description = "Growth marketing agent: deep research -> SEO -> social copy"
requires-python = ">=3.12"
dependencies = [
    "agent-framework",
    "fastapi[standard]>=0.156.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
growth-agent = "growth_agent.app:main"

[tool.uv.sources]
agent-framework = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
