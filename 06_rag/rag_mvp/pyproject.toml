[project]
name = "rag-mvp"
version = "0.1.0"
description = "Retrieval toolkit: page-aware chunking, BM25 + dense hybrid recall, RRF fusion, cross-encoder rerank"
readme = "README.md"
authors = [
    { name = "Fchen", email = "" }
]
requires-python = ">=3.12"
# 只放"任何后端都用得到、且无重依赖"的四个。
# 分层依据是 AST 扫描出的真实 import（不是声明的愿望），
# 原来 32 个依赖里有 19 个从未被任何代码 import，属于探索期残留，已删除。
dependencies = [
    "jieba>=0.42.1",        # embedding/tokenizer.py：BM25 中文分词
    "pyyaml>=6.0.3",        # eval/{golden,smoke}_schema.py：数据集解析
    "python-dotenv>=1.2.3", # generation/generator.py、scripts/run_qa_smoke.py：凭证加载
    "rank-bm25>=0.2.2",     # embedding/bm25.py：稀疏打分
]

[project.optional-dependencies]
# 本地模型推理：bge-m3 编码（embedding/bge_m3.py）+ cross-encoder 精排（reranker/bge.py）。
# 两者共用 sentence-transformers，且都会连带 torch（约 2GB）。
# 只装 core 时**不会**拉进来——这是"框架包保持零 ML 依赖"的前提。
local = [
    "sentence-transformers>=6.1.0",
]
# PDF 解析（ingestion/pdf_parser.py）。只处理 md/html 时不必装。
pdf = [
    "pymupdf>=1.28.2",
]
# Milvus 向量后端（vector_store/milvus.py 内惰性 import）。
milvus = [
    "pymilvus>=3.0.2",
]
# pgvector 向量后端（vector_store/pgvector.py 内惰性 import psycopg）。
# 只装 psycopg，不装 pgvector 这个 Python 包：向量以文本字面量 `[1,2,3]`
# 传入并 `::vector` 转型，省掉驱动注册这一步（注册漏了会报一个与向量无关的错）。
pgvector = [
    "psycopg[binary]>=3.2",
]
# 直连 LLM 的探索期实现（generation/generator.py，走 ChatDeepSeek）。
# 在 agent_framework 中它被 LLMGateway 取代，正常使用**不需要**装。
llm = [
    "langchain-deepseek>=1.1.0",
]
# 视觉检索（embedding/visual_bge.py，尚未接线）。
# 它依赖 git submodule 里的包：lock 阶段就要执行该包的 setup.py 求依赖，
# 而那个解析不过，会让**任何**新环境的 uv sync 直接失败（不是"重"，是"装不上"）。
visual = [
    "numpy",
    "torch",
    "visual-bge",
]

[project.scripts]
rag-mvp = "rag_mvp:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]

[tool.uv.sources]
visual-bge = { path = "third_party/FlagEmbedding/research/visual_bge", editable = true }
