version: 2
dataset_id: claude-code-design-guide-golden
description: 'Phase 4 Golden Dataset：单知识库 Claude Code 设计指南的检索评测集。

  gold 标注精确到 chunk_id。v1 由 qa_smoke 的 expected_sections 映射生成（10 条）；
  v2 在 chunks.jsonl 清洗（删重复印刷第十五章、修脏标题）后重映射，并扩充到 30 条，
  覆盖概念/机制/配置/对比/口语化/列举/安全/场景/负例等类型。

  用于计算 Recall@K / MRR / nDCG，对比 dense/sparse/hybrid/rerank 检索质量。'
corpus:
  chunks_path: data/processed/chunks.jsonl
  expected_chunk_count: 425
defaults:
  top_k: 10
  modes:
  - dense
  - sparse
  - hybrid
queries:
