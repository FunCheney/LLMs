version: 1
dataset_id: claude-code-design-guide-golden
description: 'Phase 4 Golden Dataset：单知识库 Claude Code 设计指南的检索评测集。

  gold 标注精确到 chunk_id（由 qa_smoke 的 expected_sections 映射生成）。

  用于计算 Recall@K / MRR / nDCG，对比 dense/sparse/hybrid 检索质量。'
corpus:
  chunks_path: data/processed/chunks.jsonl
  expected_chunk_count: 444
defaults:
  top_k: 10
  modes:
  - dense
  - sparse
  - hybrid
queries:
- id: golden-001
  question: MCP 是什么？
  tags:
  - concept
  - english_abbr
  expect_insufficient: false
  expected_points:
  - Model Context Protocol（开放协议）
  - 定义 AI 模型与外部工具/资源之间的标准通信方式（或提及 Tools/Resources/Prompts）
  notes: 概念 + 英文缩写题
  gold_chunk_ids:
  - claude-code-0001-p152-p152-c330
  - claude-code-0001-p159-p160-c348
- id: golden-002
  question: CLAUDE.md 配置文件是做什么的？
  tags:
  - keyword
  - exact_name
  expect_insufficient: false
  expected_points:
  - 作为项目的显式记忆/上下文说明文件，启动时自动读取
  - 支持全局（~/.claude/CLAUDE.md）、项目根目录、子目录多级合并
  notes: 专有名词配置题
  gold_chunk_ids:
  - claude-code-0001-p021-p021-c032
  - claude-code-0001-p109-p110-c230
  - claude-code-0001-p110-p110-c231
- id: golden-003
  question: query 执行循环是怎么工作的？
  tags:
  - semantic
  - paraphrase
  expect_insufficient: false
  expected_points:
  - 检查轮次限制并流式调用 Claude API，解析 text / thinking / tool_use
  - 若有工具调用则（并行）执行工具并将结果追加回 messages，检查 token 预算后继续循环直到无工具调用
  notes: 核心循环流程题
