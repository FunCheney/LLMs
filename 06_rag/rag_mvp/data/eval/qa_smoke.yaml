version: 1
dataset_id: claude-code-design-guide-qa-smoke
description: >
  Phase 3 RAG 问答（ask_cli）10 题验收问题集。
  用于人工与自动化检查答案要点、引用准确性与无证据拒答。

defaults:
  mode: hybrid
  top_k: 5

questions:
  - id: qa-001
    question: "MCP 是什么？"
    tags: [concept, english_abbr]
    expect_insufficient: false
    expected_sections:
      - "19.1 MCP 是什么"
      - "19.11 小结"
    expected_points:
      - "Model Context Protocol（开放协议）"
      - "定义 AI 模型与外部工具/资源之间的标准通信方式（或提及 Tools/Resources/Prompts）"
    notes: "概念 + 英文缩写题"

  - id: qa-002
    question: "CLAUDE.md 配置文件是做什么的？"
    tags: [keyword, exact_name]
    expect_insufficient: false
    expected_sections:
      - "2.7 CLAUDE.md：给 Claude 的说明书"
      - "14.2 CLAUDE.md：显式项目记忆"
    expected_points:
      - "作为项目的显式记忆/上下文说明文件，启动时自动读取"
      - "支持全局（~/.claude/CLAUDE.md）、项目根目录、子目录多级合并"
    notes: "专有名词配置题"

  - id: qa-003
    question: "query 执行循环是怎么工作的？"
    tags: [semantic, paraphrase]
    expect_insufficient: false
    expected_sections:
      - "6.5 query()：真正的执行循环"
      - "6.10 QueryEngine vs query()：职责分离"
    expected_points:
      - "检查轮次限制并流式调用 Claude API，解析 text / thinking / tool_use"
      - "若有工具调用则（并行）执行工具并将结果追加回 messages，检查 token 预算后继续循环直到无工具调用"
    notes: "核心循环流程题"

  - id: qa-004
    question: "Auto-Compact 什么时候会触发？"
    tags: [feature_name]
    expect_insufficient: false
    expected_sections:
      - "15.2 Auto-Compact 的触发机制"
      - "15.13 小结"
    expected_points:
      - "token 使用量超过 85% 时进入 warning（建议压缩/显示警告）"
      - "token 使用量超过 95% 时进入 critical（必须立即/强制压缩）"
    notes: "精确阈值题，重点核对 85% 和 95% 有无幻觉"

  - id: qa-005
    question: "对话历史压缩的核心思路是什么？"
    tags: [semantic]
    expect_insufficient: false
    expected_sections:
      - "15.3 压缩的核心算法"
    expected_points:
      - "用 Claude 自己总结较早的对话历史生成摘要"
      - "找到压缩边界，保留最近 N 条（如最近 10 条）完整消息不压缩，将摘要与保留消息拼接"
    notes: "算法原理题"

  - id: qa-006
    question: "Claude Code 的权限分几层？"
    tags: [semantic, architecture]
    expect_insufficient: false
    expected_sections:
      - "22.2 五层权限架构"
    expected_points:
      - "分为五层（从粗到细）"
      - "会话模式、工具白名单/黑名单、工具级权限、操作级权限、路径/命令级权限"
    notes: "架构分层列举题"

  - id: qa-007
    question: "QueryEngine 的 submitMessage 做什么？"
    tags: [keyword, section_number]
    expect_insufficient: false
    expected_sections:
      - "6.4 submitMessage：一次对话轮次的完整流程"
    expected_points:
      - "预处理用户输入（斜杠命令、附件、Memory）并构建消息列表"
      - "调用 query() 执行核心循环，随后做后处理（记录 token、保存历史、触发 hooks、检查压缩）并流式返回结果"
    notes: "API/方法流程题"

  - id: qa-008
    question: "流式响应是怎么解析的？"
    tags: [semantic]
    expect_insufficient: false
    expected_sections:
      - "8.3 流式响应的解析"
      - "8.1 为什么流式处理如此重要"
    expected_points:
      - "基于 SSE 事件流（content_block_start / content_block_delta / content_block_stop / message_stop）解析"
      - "文本块（text_delta）实时输出给用户，思考块内部处理，工具调用块（input_json_delta）累积完整 JSON 后再执行"
    notes: "流式处理机制题"

  - id: qa-009
    question: "Claude Code 有哪几种代理模式？"
    tags: [semantic]
    expect_insufficient: false
    expected_sections:
      - "17.2 Claude Code 的三种代理模式"
      - "17.3 代理类型系统"
    expected_points:
      - "三种代理模式：子代理（AgentTool）、后台代理（run_in_background）、Worktree 隔离代理"
      - "（或若检索落在 17.3）内置专业化代理类型：general-purpose、Explore、Plan"
    notes: "已知检索难点：k=5 时可能落入 17.3/17.5，验收时区分检索召回与生成忠实度"

  - id: qa-010
    question: "Kafka 消费者如何提交 offset？"
    tags: [negative, out_of_domain]
    expect_insufficient: true
    expected_sections: []
    expected_points:
      - "明确说明当前参考资料中没有足够依据，不利用模型自身知识回答 Kafka 机制"
    notes: "库外负例题，必须触发 insufficient_evidence=true"
